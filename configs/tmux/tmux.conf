# ── Session Behavior ─────────────────────────────────────
set -g detach-on-destroy off     # stay in tmux when closing a session — switch to next
setw -g monitor-activity on      # alert on background window activity

# ── Input ─────────────────────────────────────────────────
set -s focus-events on           # pass focus in/out events to programs (needed by nvim)
set -s extended-keys on          # pass Ctrl+Shift+letter sequences to programs

# ── Clipboard ─────────────────────────────────────────────
set -g set-clipboard on          # use OSC 52 to write to system clipboard via Ghostty

# ── Keybinds ─────────────────────────────────────────────
# Splits — keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps cwd
bind c new-window -c "#{pane_current_path}"

# Pane resize — prefix+H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane resize — M-H/J/K/L (no prefix, matches tmux.nvim resize keys in nvim)
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Session switch — M-1..9 (no prefix, Opt+N via macos-option-as-alt=left in Ghostty)
bind -n M-1 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 1"
bind -n M-2 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 2"
bind -n M-3 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 3"
bind -n M-4 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 4"
bind -n M-5 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 5"
bind -n M-6 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 6"
bind -n M-7 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 7"
bind -n M-8 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 8"
bind -n M-9 run-shell "sh '$OPENSESSIONS_DIR/integrations/tmux-plugin/scripts/switch-index.sh' 9"

# Lazygit popup
bind g display-popup -E -w 90% -h 90% "lazygit"

# ── IDE Layout ────────────────────────────────────────────
# prefix+I: nvim (left) + opencode (right) + terminal (bottom 20%)
# Sequence: split-down 20% from original pane → select top-left → split-right
#           → launch apps → leave focus on terminal pane
bind I split-window -v -l 20% -c "#{pane_current_path}" \; \
     select-pane -t 1 \; \
     split-window -h -c "#{pane_current_path}" \; \
     select-pane -t 1 \; \
     send-keys "NVIM_IDE=1 nvim" Enter \; \
     select-pane -t 2 \; \
     send-keys "opencode" Enter \; \
     select-pane -t 3

# Exit tmux (detach)
bind Escape detach-client

# Renumber windows on close
set -g renumber-windows on

# Keep pane numbering consistent with window numbering
setw -g pane-base-index 1

# ── Copy mode (vi) ────────────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Mouse drag in normal mode: auto-enter copy-mode and copy selection
# Works with set-clipboard=on → OSC 52 → Ghostty → system clipboard
# Use Shift+drag to bypass tmux and select with Ghostty natively (then Cmd+C)
bind -n MouseDrag1Pane if -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -eM"
bind -n MouseDragEnd1Pane if -F "#{mouse_any_flag}" "send-keys -M" "send-keys -X copy-selection-and-cancel"

# ── Cmd Key Passthrough (Ghostty → tmux → neovim) ────────
# Ghostty sends custom escape sequences for Cmd+key combos.
# tmux user-keys receive the ~ format and re-emit as CSI u format
# so neovim can bind them as <D-*> mappings.
set -s user-keys[0] "\e[112;9~"   # Cmd+P
set -s user-keys[1] "\e[70;10~"   # Cmd+Shift+F
set -s user-keys[2] "\e[80;10~"   # Cmd+Shift+P

bind-key -n User0 send-keys -l "\e[112;9u"   # → <D-p>    find file
bind-key -n User1 send-keys -l "\e[70;10u"   # → <D-S-f>  live grep
bind-key -n User2 send-keys -l "\e[80;10u"   # → <D-S-p>  command palette

# ── Terminal Capabilities ────────────────────────────────
# Ghostty-specific: modern terminal-features (tmux 3.2+)
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

# Fallback wildcard overrides for other terminals (wezterm, SSH, etc.)
set -as terminal-overrides ',*:Tc'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Lackluster Theme ─────────────────────────────────────
# Colors from lackluster palette (ghostty/nvim)
#   bg:      #0a0a0a   fg:      #deeeed
#   green:   #789978   orange:  #ffaa88
#   slate:   #708090   dim:     #444444
#   mid:     #7a7a7a   blue:    #7788aa

set -g status-position top
set -g status-style 'bg=#0a0a0a,fg=#708090'
# status-left-length matches the opensessions sidebar width (26 cols default).
# This aligns the window tab list with the left edge of the main pane area.
# If you resize the sidebar, update this to match.
set -g status-left-length 26
set -g status-right-length 60

# Left: session name pill, padded to fill the sidebar width (26 cols).
# The ▐ separator sits at the sidebar/content boundary.
set -g status-left '#[fg=#0a0a0a,bg=#789978,bold] #S #[fg=#789978,bg=#0a0a0a,none]▐#[default]'

# Right: prefix indicator + time
set -g status-right '#[fg=#444444]#{?client_prefix,#[fg=#ffaa88]⬡ prefix ,}#[fg=#708090]%H:%M  #[fg=#444444]%d %b '

# Window tabs — tab-bar style with block separators
set -g window-status-separator ''
set -g window-status-format         '#[fg=#444444,bg=#0a0a0a] #I #[fg=#444444]#{?window_activity_flag,#[fg=#7788aa],}#W #[fg=#444444]│'
set -g window-status-current-format '#[fg=#0a0a0a,bg=#ffaa88] #I #[fg=#0a0a0a,bold]#W #[fg=#ffaa88,bg=#0a0a0a,none]▌'

# Pane borders — dim inactive, green active (makes opensessions sidebar edge visible)
set -g pane-border-style         'fg=#222222'
set -g pane-active-border-style  'fg=#789978'
set -g pane-border-lines         single

# Messages and copy mode
set -g message-style          'bg=#0a0a0a,fg=#deeeed'
set -g message-command-style  'bg=#0a0a0a,fg=#ffaa88'
set -g mode-style             'bg=#7a7a7a,fg=#0a0a0a'
