name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build hosts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            accept-flake-config = true
      - name: Build spellbook (darwin cross-compile check)
        run: nix build .#darwinConfigurations.spellbook.system --dry-run
      - name: Build tower (NixOS/WSL)
        run: nix build .#nixosConfigurations.tower.config.system.build.toplevel --dry-run
  check:
    name: Flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            accept-flake-config = true
      - name: nix flake check
        run: nix flake check --no-build
  fmt:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            accept-flake-config = true
      - name: Check formatting
        run: nix fmt -- --fail-on-change
  lint:
    name: Lint (deadnix + statix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            accept-flake-config = true
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail flake/
      - name: statix
        run: nix run nixpkgs#statix -- check flake/
